openapi: 3.0.3
info:
  title: Medigram API
  description: |
    Medigram API - Medical Information Sharing Platform

    ## Features
    - Medical cards management
    - Social features (comments, likes, shares)
    - Premium subscriptions (Iyzico integration)
    - AI-powered features (DALL-E, GPT-4)
    - User authentication and authorization

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
  version: 1.0.0
  contact:
    name: Medigram Support
    email: support@medigram.com

servers:
  - url: http://localhost:1337/api
    description: Development server
  - url: https://api.medigram.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Medical Cards
    description: Medical information cards
  - name: Comments
    description: Card comments and discussions
  - name: Subscriptions
    description: Premium subscription management
  - name: AI Services
    description: AI-powered features
  - name: Categories
    description: Content categories

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
            name:
              type: string
            message:
              type: string
            details:
              type: object

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        confirmed:
          type: boolean
        blocked:
          type: boolean

    MedicalCard:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
        subcategory:
          type: string
        imageUrl:
          type: string
        thumbnail:
          type: string
        source:
          type: string
        author:
          type: string
        aiImagePrompt:
          type: string
          nullable: true
        likes:
          type: array
          items:
            type: string
        commentCount:
          type: integer
        shareCount:
          type: integer
        isPremium:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        author:
          $ref: '#/components/schemas/User'
        medicalCard:
          type: integer
        parentComment:
          type: integer
          nullable: true
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        likes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        id:
          type: integer
        user:
          type: integer
        plan:
          type: string
          enum: [monthly, yearly]
        status:
          type: string
          enum: [active, canceled, expired]
        iyzicoSubscriptionId:
          type: string
        iyzicoPaymentId:
          type: string
        amount:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

paths:
  # Authentication
  /auth/local/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/local:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or username
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Medical Cards
  /medical-cards:
    get:
      tags:
        - Medical Cards
      summary: List medical cards
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of medical cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedicalCard'
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object

    post:
      tags:
        - Medical Cards
      summary: Create new medical card
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - category
              properties:
                title:
                  type: string
                content:
                  type: string
                category:
                  type: string
                subcategory:
                  type: string
                imageUrl:
                  type: string
                source:
                  type: string
                isPremium:
                  type: boolean
      responses:
        '200':
          description: Card created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicalCard'

  /medical-cards/{id}:
    get:
      tags:
        - Medical Cards
      summary: Get medical card by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Medical card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicalCard'

  /medical-cards/{id}/like:
    post:
      tags:
        - Medical Cards
      summary: Like a medical card
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Card liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicalCard'

  # AI Services
  /ai-service/generate-image:
    post:
      tags:
        - AI Services
      summary: Generate medical image using DALL-E
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  maxLength: 1000
                size:
                  type: string
                  enum: ['1024x1024']
                  default: '1024x1024'
                n:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Image generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      images:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                            revised_prompt:
                              type: string
        '403':
          description: Premium subscription required

  /ai-service/recommendations:
    get:
      tags:
        - AI Services
      summary: Get personalized content recommendations
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Personalized recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recommendations:
                        type: array
                        items:
                          $ref: '#/components/schemas/MedicalCard'
                      userPreferences:
                        type: object

  # Subscriptions
  /subscription/checkout:
    post:
      tags:
        - Subscriptions
      summary: Create Iyzico checkout for subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
              properties:
                plan:
                  type: string
                  enum: [monthly, yearly]
      responses:
        '200':
          description: Checkout URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkoutUrl:
                        type: string

  /subscription/my:
    get:
      tags:
        - Subscriptions
      summary: Get my subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
